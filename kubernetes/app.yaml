apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloud-echo
  labels:
    app: cloud-echo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cloud-echo
  template:
    metadata:
      labels:
        app: cloud-echo
    spec:
      imagePullSecrets: [
        {
          name: ibm-registry-secret
        }
      ]
      containers: [
        {
          name: app,
          image: ghcr.io/mdlugosch/cloud-echo:1.0@sha256:30327d18862d60e7c62fc52f49397306f6ce7ac6c3e254dcb2b4fef5078cf9b6,
          ports: [
            {
              containerPort: 8080
            }
          ]
        }
      ]
---
apiVersion: v1
kind: Service
metadata:
  name: cloud-echo
  labels:
    app: cloud-echo
spec:
  type: ClusterIP
  ports: [
    {
      port: 8080,
      targetPort: 8080
    }
  ]
  selector:
    app: cloud-echo